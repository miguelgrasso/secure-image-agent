[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secure-image-agent"
version = "0.1.0"
description = "Agente (Strands Agents) que empaqueta imágenes de contenedor desde repositorios con enfoque DevSecOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents~=1.57",      # SDK de agentes (grafo, hooks, structured output)
    "pydantic~=2.13",            # contratos de datos entre nodos
    "pydantic-settings~=2.15",   # configuración desde .env / variables de entorno
    "pyyaml~=6.0",               # lectura de policies/exceptions.yaml
    "typer~=0.27",               # CLI: secure-image-agent build <repo>
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-mock~=3.16",
    "ruff~=0.16",
    "mypy~=2.3",
]
evals = [
    "strands-agents-evals~=1.4",
]

[project.scripts]
secure-image-agent = "secure_image_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_image_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]   # S = reglas de seguridad (bandit)

[tool.pytest.ini_options]
testpaths = ["tests"]
